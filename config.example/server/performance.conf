# Load of the server: block sending, emerge threads, map storage.
#
# Every setting of this file is listed below with the value the engine
# uses when the line is absent. Remove the leading # to change one.

#
# Mapgen
#

# From how far blocks are generated for clients, stated in mapblocks (16 nodes).
# max_block_generate_distance = 10

#
# Advanced / Advanced / Server/Env Performance
#

# Length of a server tick (the interval at which everything is generally updated),
# stated in seconds.
# Does not apply to sessions hosted from the client menu.
# This is a lower bound, i.e. server steps may not be shorter than this, but
# they are often longer.
# dedicated_server_step = 0.09

# Whether players are shown to clients without any range limit.
# Deprecated, use the setting player_transfer_distance instead.
# unlimited_player_transfer_distance = true

# Defines the maximal player transfer distance in blocks (0 = unlimited).
# player_transfer_distance = 0

# From how far clients know about objects, stated in mapblocks (16 nodes).
#
# Setting this larger than active_block_range will also cause the server
# to maintain active objects up to this distance in the direction the
# player is looking. (This can avoid mobs suddenly disappearing from view)
# active_object_send_range_blocks = 8

# The radius of the volume of blocks around every player that is subject to the
# active block stuff, stated in mapblocks (16 nodes).
# In active blocks objects are loaded and ABMs run.
# This is also the minimum range in which active objects (mobs) are maintained.
# This should be configured together with active_object_send_range_blocks.
# active_block_range = 4

# From how far blocks are sent to clients, stated in mapblocks (16 nodes).
# max_block_send_distance = 12

# Default maximum number of forceloaded mapblocks.
# Set this to -1 to disable the limit.
# max_forceloaded_blocks = 16

# Interval of saving important changes in the world, stated in seconds.
# server_map_save_interval = 5.3

# How long the server will wait before unloading unused mapblocks, stated in seconds.
# Higher value is smoother, but will use more RAM.
# server_unload_unused_data_timeout = 29

# Maximum number of statically stored objects in a block.
# max_objects_per_block = 256

# Length of time between active block management cycles, stated in seconds.
# active_block_mgmt_interval = 2.0

# Length of time between Active Block Modifier (ABM) execution cycles, stated in seconds.
# abm_interval = 1.0

# The time budget allowed for ABMs to execute on each step
# (as a fraction of the ABM Interval)
# abm_time_budget = 0.2

# Length of time between NodeTimer execution cycles, stated in seconds.
# nodetimer_interval = 0.2

# Max liquids processed per step.
# liquid_loop_max = 100000

# The time (in seconds) that the liquids queue may grow beyond processing
# capacity until an attempt is made to decrease its size by dumping old queue
# items.  A value of 0 disables the functionality.
# liquid_queue_purge_time = 0

# Liquid update interval in seconds.
# liquid_update = 1.0

# At this distance the server will aggressively optimize which blocks are sent to
# clients.
# Small values potentially improve performance a lot, at the expense of visible
# rendering glitches (some blocks might not be rendered correctly in caves).
# Setting this to a value greater than max_block_send_distance disables this
# optimization.
# Stated in MapBlocks (16 nodes).
# block_send_optimize_distance = 4

# If enabled, the server will perform map block occlusion culling based on
# on the eye position of the player. This can reduce the number of blocks
# sent to the client by 50-80%. Clients will no longer receive most
# invisible blocks, so that the utility of noclip mode is reduced.
# server_side_occlusion_culling = true

# At this distance the server will consider blocks as "far away".
# It will perform simpler and cheaper occlusion checks, update
# low priority block updates lazily, and limit the blocks sent to the
# client in one roundtrip.
# This is especially useful for very large viewing range (upwards of 500).
# Stated in MapBlocks (16 nodes).
# block_cull_optimize_distance = 25

#
# Advanced / Advanced / Mapgen
#

# Dump the mapgen debug information.
# enable_mapgen_debug_info = false

# Maximum number of blocks that can be queued for loading.
# emergequeue_limit_total = 1024

# Maximum number of blocks to be queued that are to be loaded from file.
# This limit is enforced per player.
# emergequeue_limit_diskonly = 128

# Maximum number of blocks to be queued that are to be generated.
# This limit is enforced per player.
# emergequeue_limit_generate = 128

# Number of emerge threads (responsible for map generation and loading) to use.
# If 0 then the engine will automatically choose a suitable value depending
# on the hardware and type of map generator.
# WARNING: There are known bugs in the default map generators (v6, v7, ...)
# when using more than 1 thread. The automatic choice will avoid this.
# num_emerge_threads = 0

#
# Advanced / Advanced / Miscellaneous
#

# Number of extra blocks that can be loaded by /clearobjects at once.
# This is a trade-off between SQLite transaction overhead and
# memory consumption (4096=100MB, as a rule of thumb).
# max_clearobjects_extra_loaded_blocks = 4096

# See https://www.sqlite.org/pragma.html#pragma_synchronous
# sqlite_synchronous = 2

# Compression level to use when saving mapblocks to disk.
# -1 - use default compression level
# 0 - least compression, fastest
# 9 - best compression, slowest
# map_compression_level_disk = -1
