# Map generation. Applied to worlds at creation time.
#
# Every setting of this file is listed below with the value the engine
# uses when the line is absent. Remove the leading # to change one.

#
# Mapgen
#

# A chosen map seed for a new map, leave empty for random.
# Will be overridden when creating a new world in the main menu.
# fixed_map_seed =

# Name of map generator to be used when creating a new world.
# Creating a world in the main menu will override this.
# Current mapgens in a highly unstable state:
# -    The optional floatlands of v7 (disabled by default).
# mg_name = v7

# Water surface level of the world.
# water_level = 1

# Limit of map generation, in nodes, in all 6 directions from (0, 0, 0).
# Only mapchunks completely within the mapgen limit are generated.
# Value is stored per-world.
# mapgen_limit = 31007

# Global map generation attributes.
# In Mapgen v6 the 'decorations' flag controls all decorations except trees
# and jungle grass, in all other mapgens this flag controls all decorations.
# mg_flags = caves,dungeons,light,decorations,biomes,ores

#
# Mapgen / Biome API
#

# Temperature variation for biomes.
# mg_biome_np_heat = 50, 50, (1000, 1000, 1000), 5349, 3, 0.5, 2.0, eased

# Small-scale temperature variation for blending biomes on borders.
# mg_biome_np_heat_blend = 0, 1.5, (8, 8, 8), 13, 2, 1.0, 2.0, eased

# Humidity variation for biomes.
# mg_biome_np_humidity = 50, 50, (1000, 1000, 1000), 842, 3, 0.5, 2.0, eased

# Small-scale humidity variation for blending biomes on borders.
# mg_biome_np_humidity_blend = 0, 1.5, (8, 8, 8), 90003, 2, 1.0, 2.0, eased

#
# Mapgen / Mapgen V5
#

# Map generation attributes specific to Mapgen v5.
# mgv5_spflags = caverns

# Controls width of tunnels, a smaller value creates wider tunnels.
# Value >= 10.0 completely disables generation of tunnels and avoids the
# intensive noise calculations.
# mgv5_cave_width = 0.09

# Y of upper limit of large caves.
# mgv5_large_cave_depth = -256

# Minimum limit of random number of small caves per mapchunk.
# mgv5_small_cave_num_min = 0

# Maximum limit of random number of small caves per mapchunk.
# mgv5_small_cave_num_max = 0

# Minimum limit of random number of large caves per mapchunk.
# mgv5_large_cave_num_min = 0

# Maximum limit of random number of large caves per mapchunk.
# mgv5_large_cave_num_max = 2

# Proportion of large caves that contain liquid.
# mgv5_large_cave_flooded = 0.5

# Y-level of cavern upper limit.
# mgv5_cavern_limit = -256

# Y-distance over which caverns expand to full size.
# mgv5_cavern_taper = 256

# Defines full size of caverns, smaller values create larger caverns.
# mgv5_cavern_threshold = 0.7

# Lower Y limit of dungeons.
# mgv5_dungeon_ymin = -31000

# Upper Y limit of dungeons.
# mgv5_dungeon_ymax = 31000

#
# Mapgen / Mapgen V5 / Noises
#

# Variation of biome filler depth.
# mgv5_np_filler_depth = 0, 1, (150, 150, 150), 261, 4, 0.7, 2.0, eased

# Variation of terrain vertical scale.
# When noise is < -0.55 terrain is near-flat.
# mgv5_np_factor = 0, 1, (250, 250, 250), 920381, 3, 0.45, 2.0, eased

# Y-level of average terrain surface.
# mgv5_np_height = 0, 10, (250, 250, 250), 84174, 4, 0.5, 2.0, eased

# First of two 3D noises that together define tunnels.
# mgv5_np_cave1 = 0, 12, (61, 61, 61), 52534, 3, 0.5, 2.0

# Second of two 3D noises that together define tunnels.
# mgv5_np_cave2 = 0, 12, (67, 67, 67), 10325, 3, 0.5, 2.0

# 3D noise defining giant caverns.
# mgv5_np_cavern = 0, 1, (384, 128, 384), 723, 5, 0.63, 2.0

# 3D noise defining terrain.
# mgv5_np_ground = 0, 40, (80, 80, 80), 983240, 4, 0.55, 2.0, eased

# 3D noise that determines number of dungeons per mapchunk.
# mgv5_np_dungeons = 0.9, 0.5, (500, 500, 500), 0, 2, 0.8, 2.0

#
# Mapgen / Mapgen V6
#

# Map generation attributes specific to Mapgen v6.
# The 'snowbiomes' flag enables the new 5 biome system.
# When the 'snowbiomes' flag is enabled jungles are automatically enabled and
# the 'jungles' flag is ignored.
# The 'temples' flag disables generation of desert temples. Normal dungeons will appear instead.
# mgv6_spflags = jungles,biomeblend,mudflow,snowbiomes,noflat,trees,temples

# Deserts occur when np_biome exceeds this value.
# When the 'snowbiomes' flag is enabled, this is ignored.
# mgv6_freq_desert = 0.45

# Sandy beaches occur when np_beach exceeds this value.
# mgv6_freq_beach = 0.15

# Lower Y limit of dungeons.
# mgv6_dungeon_ymin = -31000

# Upper Y limit of dungeons.
# mgv6_dungeon_ymax = 31000

#
# Mapgen / Mapgen V6 / Noises
#

# Y-level of lower terrain and seabed.
# mgv6_np_terrain_base = -4, 20, (250, 250, 250), 82341, 5, 0.6, 2.0, eased

# Y-level of higher terrain that creates cliffs.
# mgv6_np_terrain_higher = 20, 16, (500, 500, 500), 85039, 5, 0.6, 2.0, eased

# Varies steepness of cliffs.
# mgv6_np_steepness = 0.85, 0.5, (125, 125, 125), -932, 5, 0.7, 2.0, eased

# Defines distribution of higher terrain.
# mgv6_np_height_select = 0.5, 1, (250, 250, 250), 4213, 5, 0.69, 2.0, eased

# Varies depth of biome surface nodes.
# mgv6_np_mud = 4, 2, (200, 200, 200), 91013, 3, 0.55, 2.0, eased

# Defines areas with sandy beaches.
# mgv6_np_beach = 0, 1, (250, 250, 250), 59420, 3, 0.50, 2.0, eased

# Temperature variation for biomes.
# mgv6_np_biome = 0, 1, (500, 500, 500), 9130, 3, 0.50, 2.0, eased

# Variation of number of caves.
# mgv6_np_cave = 6, 6, (250, 250, 250), 34329, 3, 0.50, 2.0, eased

# Humidity variation for biomes.
# mgv6_np_humidity = 0.5, 0.5, (500, 500, 500), 72384, 3, 0.50, 2.0, eased

# Defines tree areas and tree density.
# mgv6_np_trees = 0, 1, (125, 125, 125), 2, 4, 0.66, 2.0, eased

# Defines areas where trees have apples.
# mgv6_np_apple_trees = 0, 1, (100, 100, 100), 342902, 3, 0.45, 2.0, eased

#
# Mapgen / Mapgen V7
#

# Map generation attributes specific to Mapgen v7.
# 'ridges': Rivers.
# 'floatlands': Floating land masses in the atmosphere.
# 'caverns': Giant caves deep underground.
# mgv7_spflags = mountains,ridges,nofloatlands,caverns

# Y of mountain density gradient zero level. Used to shift mountains vertically.
# mgv7_mount_zero_level = 0

# Lower Y limit of floatlands.
# mgv7_floatland_ymin = 1024

# Upper Y limit of floatlands.
# mgv7_floatland_ymax = 4096

# Y-distance over which floatlands taper from full density to nothing.
# Tapering starts at this distance from the Y limit.
# For a solid floatland layer, this controls the height of hills/mountains.
# Must be less than or equal to half the distance between the Y limits.
# mgv7_floatland_taper = 256

# Exponent of the floatland tapering. Alters the tapering behavior.
# Value = 1.0 creates a uniform, linear tapering.
# Values > 1.0 create a smooth tapering suitable for the default separated
# floatlands.
# Values < 1.0 (for example 0.25) create a more defined surface level with
# flatter lowlands, suitable for a solid floatland layer.
# mgv7_float_taper_exp = 2.0

# Adjusts the density of the floatland layer.
# Increase value to increase density. Can be positive or negative.
# Value = 0.0: 50% of volume is floatland.
# Value = 2.0 (can be higher depending on 'mgv7_np_floatland', always test
# to be sure) creates a solid floatland layer.
# mgv7_floatland_density = -0.6

# Surface level of optional water placed on a solid floatland layer.
# Water is disabled by default and will only be placed if this value is set
# to above 'mgv7_floatland_ymax' - 'mgv7_floatland_taper' (the start of the
# upper tapering).
# ***WARNING, POTENTIAL DANGER TO WORLDS AND SERVER PERFORMANCE***:
# When enabling water placement, floatlands must be configured and tested
# to be a solid layer by setting 'mgv7_floatland_density' to 2.0 (or other
# required value depending on 'mgv7_np_floatland'), to avoid
# server-intensive extreme water flow and to avoid vast flooding of the
# world surface below.
# mgv7_floatland_ywater = -31000

# Controls width of tunnels, a smaller value creates wider tunnels.
# Value >= 10.0 completely disables generation of tunnels and avoids the
# intensive noise calculations.
# mgv7_cave_width = 0.09

# Y of upper limit of large caves.
# mgv7_large_cave_depth = -33

# Minimum limit of random number of small caves per mapchunk.
# mgv7_small_cave_num_min = 0

# Maximum limit of random number of small caves per mapchunk.
# mgv7_small_cave_num_max = 0

# Minimum limit of random number of large caves per mapchunk.
# mgv7_large_cave_num_min = 0

# Maximum limit of random number of large caves per mapchunk.
# mgv7_large_cave_num_max = 2

# Proportion of large caves that contain liquid.
# mgv7_large_cave_flooded = 0.5

# Y-level of cavern upper limit.
# mgv7_cavern_limit = -256

# Y-distance over which caverns expand to full size.
# mgv7_cavern_taper = 256

# Defines full size of caverns, smaller values create larger caverns.
# mgv7_cavern_threshold = 0.7

# Lower Y limit of dungeons.
# mgv7_dungeon_ymin = -31000

# Upper Y limit of dungeons.
# mgv7_dungeon_ymax = 31000

#
# Mapgen / Mapgen V7 / Noises
#

# Y-level of higher terrain that creates cliffs.
# mgv7_np_terrain_base = 4, 70, (600, 600, 600), 82341, 5, 0.6, 2.0, eased

# Y-level of lower terrain and seabed.
# mgv7_np_terrain_alt = 4, 25, (600, 600, 600), 5934, 5, 0.6, 2.0, eased

# Varies roughness of terrain.
# Defines the 'persistence' value for terrain_base and terrain_alt noises.
# mgv7_np_terrain_persist = 0.6, 0.1, (2000, 2000, 2000), 539, 3, 0.6, 2.0, eased

# Defines distribution of higher terrain and steepness of cliffs.
# mgv7_np_height_select = -8, 16, (500, 500, 500), 4213, 6, 0.7, 2.0, eased

# Variation of biome filler depth.
# mgv7_np_filler_depth = 0, 1.2, (150, 150, 150), 261, 3, 0.7, 2.0, eased

# Variation of maximum mountain height (in nodes).
# mgv7_np_mount_height = 256, 112, (1000, 1000, 1000), 72449, 3, 0.6, 2.0, eased

# Defines large-scale river channel structure.
# mgv7_np_ridge_uwater = 0, 1, (1000, 1000, 1000), 85039, 5, 0.6, 2.0, eased

# 3D noise defining mountain structure and height.
# Also defines structure of floatland mountain terrain.
# mgv7_np_mountain = -0.6, 1, (250, 350, 250), 5333, 5, 0.63, 2.0

# 3D noise defining structure of river canyon walls.
# mgv7_np_ridge = 0, 1, (100, 100, 100), 6467, 4, 0.75, 2.0

# 3D noise defining structure of floatlands.
# If altered from the default, the noise 'scale' (0.7 by default) may need
# to be adjusted, as floatland tapering functions best when this noise has
# a value range of approximately -2.0 to 2.0.
# mgv7_np_floatland = 0, 0.7, (384, 96, 384), 1009, 4, 0.75, 1.618

# 3D noise defining giant caverns.
# mgv7_np_cavern = 0, 1, (384, 128, 384), 723, 5, 0.63, 2.0

# First of two 3D noises that together define tunnels.
# mgv7_np_cave1 = 0, 12, (61, 61, 61), 52534, 3, 0.5, 2.0

# Second of two 3D noises that together define tunnels.
# mgv7_np_cave2 = 0, 12, (67, 67, 67), 10325, 3, 0.5, 2.0

# 3D noise that determines number of dungeons per mapchunk.
# mgv7_np_dungeons = 0.9, 0.5, (500, 500, 500), 0, 2, 0.8, 2.0

