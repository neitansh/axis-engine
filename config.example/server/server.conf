# Identity of the server: name, world, message of the day, admin.
#
# Every setting of this file is listed below with the value the engine
# uses when the line is absent. Remove the leading # to change one.

#
# Client and Server / Server
#

# Name of the player.
# When running a server, a client connecting with this name is admin.
# When starting from the main menu, this is overridden.
# name =

# World a dedicated server runs, taken from the worlds folder.
# A world of that name is created if it does not exist yet.
# The "--worldname" and "--world" arguments take precedence over this.
# main_world_name = world

#
# Client and Server / Server / Serverlist and MOTD
#

# Name of the server, to be displayed when players join and in the serverlist.
# server_name = Luanti server

# Description of server, to be displayed when players join and in the serverlist.
# server_description = mine here

# Domain name of server, to be displayed in the serverlist.
# server_address = game.example.net

# Homepage of server, to be displayed in the serverlist.
# server_url = https://game.example.net

# Automatically report to the serverlist.
# server_announce = false

# Send names of online players to the serverlist. If disabled only the player count is revealed.
# server_announce_send_players = true

# Message of the day displayed to players connecting.
# motd =

# Maximum number of players that can be connected simultaneously.
# max_users = 15

# If this is set, players will always (re)spawn at the given position.
# static_spawnpoint =

#
# Advanced / Developer Options / Debugging
#

# Enable mod channels support.
# enable_mod_channels = false

#
# Advanced / Advanced / Server
#

# Format of player chat messages. The following strings are valid placeholders:
# @name, @message, @timestamp (optional)
# chat_message_format = <@name> @message

# If the execution of a chat command takes longer than this specified time in
# seconds, add the time information to the chat command message
# chatcommand_msg_time_threshold = 0.1

# A message to be displayed to all clients when the server shuts down.
# kick_msg_shutdown = Server shutting down.

# A message to be displayed to all clients when the server crashes.
# kick_msg_crash = This server has experienced an internal error. You will now be disconnected.

# Whether to ask clients to reconnect after a (Lua) crash.
# Set this to true if your server is set up to restart automatically.
# ask_reconnect_on_crash = false

# If enabled, node and inventory actions are recorded for rollback.
# This option is only read on server start. Note that the engine will not
# automatically clean old entries from the rollback database.
# enable_rollback_recording = false

#
# Advanced / Advanced / Miscellaneous
#

# If enabled, invalid world data won't cause the server to shut down.
# Only enable this if you know what you are doing.
# ignore_world_load_errors = false

# World directory (everything in the world is stored here).
# Not needed if starting from the main menu.
# map-dir =
