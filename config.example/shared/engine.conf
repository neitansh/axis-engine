# Engine behaviour both the client and the server rely on.
#
# Every setting of this file is listed below with the value the engine
# uses when the line is absent. Remove the leading # to change one.

#
# Graphics and Audio / User Interfaces
#

# Set the language. By default, the system language is used.
# A restart is required after changing this.
# language = ,be,bg,ca,cs,da,de,el,en,eo,es,et,eu,fi,fr,gd,gl,hu,id,it,ja,jbo,kk,ko,lt,lv,ms,nb,nl,nn,pl,pt,pt_BR,ro,ru,sk,sl,sr_Cyrl,sr_Latn,sv,sw,tr,uk,vi,zh_CN,zh_TW

#
# Client and Server / Client
#

# URL to the server list displayed in the Multiplayer Tab.
# serverlist_url =

# Load every mod found in the mods folder and nothing else: a mod that is
# there runs, a mod that is gone does not. Worlds keep no mod list at all.
# Turn this off to let each world pick its mods again.
# enable_all_mods = true

#
# Client and Server / Server / Serverlist and MOTD
#

# Announce to this serverlist.
# serverlist_url =

#
# Advanced / Developer Options
#

# Enable Lua modding support on client.
# This support is experimental and API can change.
# enable_client_modding = false

# Where to enable server-sent client-side modding (SSCSM).
# Warning: Experimental.
# enable_sscsm = nowhere

#
# Advanced / Advanced / Networking
#

# Enable IPv6 support (for both client and server).
# Required for IPv6 connections to work at all.
# enable_ipv6 = true

# Maximum number of packets sent per send step in the low-level networking code.
# You generally don't need to change this, however busy servers may benefit from a higher number.
# max_packets_per_iteration = 1024

#
# Advanced / Advanced / cURL
#

# Maximum time an interactive request (e.g. server list fetch) may take, stated in milliseconds.
# curl_timeout = 20000

# Limits number of parallel HTTP requests. Affects:
# -    Media fetch if server uses remote_media setting.
# -    Serverlist download and server announcement.
# -    Downloads performed by main menu (e.g. mod manager).
# Only has an effect if compiled with cURL.
# curl_parallel_limit = 8

# Maximum time a file download (e.g. a mod download) may take, stated in milliseconds.
# curl_file_download_timeout = 300000

#
# Advanced / Advanced / Miscellaneous
#

# Windows systems only: Start Luanti with the command line window in the background.
# Contains the same information as the file debug.txt (default name).
# enable_console = false
