# Logging, profiling and developer switches.
#
# Every setting of this file is listed below with the value the engine
# uses when the line is absent. Remove the leading # to change one.

#
# Advanced / Developer Options / Debugging
#

# Level of logging to be written to debug.txt:
# -    <nothing> (no logging)
# -    none (messages with no level)
# -    error
# -    warning
# -    action
# -    info
# -    verbose
# -    trace
# debug_log_level = action

# If the file size of debug.txt exceeds the number of megabytes specified in
# this setting when it is opened, the file is moved to debug.txt.1,
# deleting an older debug.txt.1 if it exists.
# debug.txt is only moved if this setting is positive.
# debug_log_size_max = 50

# Minimal level of logging to be written to chat.
# chat_log_level = error

# Handling for deprecated Lua API calls:
# -    none: Do not log deprecated calls
# -    log: mimic and log backtrace of deprecated call (default).
# -    error: abort on usage of deprecated call (suggested for mod developers).
# deprecated_lua_api_handling = log

# Enable random user input (only used for testing).
# random_input = false

# Enable random mod loading (mainly used for testing).
# random_mod_load_order = false

#
# Advanced / Developer Options / Mod Profiler
#

# Load the game profiler to collect game profiling data.
# Provides a /profiler command to access the compiled profile.
# Useful for mod developers and server operators.
# profiler.load = false

# Disable if you only want to instrument with Tracy.
# profiler.measure = true

# Capture Tracy zones with the profiler's instrumentation.
# You need to build with Tracy to use this, see doc/developing/profiling.md
# for details.
# profiler.tracy = false

# The default format in which profiles are being saved,
# when calling `/profiler save [format]` without format.
# profiler.default_report_format = txt

# The file path relative to your world path in which profiles will be saved to.
# profiler.report_path =

# Instrument the methods of entities on registration.
# instrument.entity = true

# Instrument the action function of Active Block Modifiers on registration.
# instrument.abm = true

# Instrument the action function of Loading Block Modifiers on registration.
# instrument.lbm = true

# Instrument chat commands on registration.
# instrument.chatcommand = true

# Instrument global callback functions on registration.
# (anything you pass to a core.register_*() function)
# instrument.global_callback = true

# Instrument builtin.
# This is usually only needed by core/builtin contributors
# instrument.builtin = false

# Have the profiler instrument itself:
# * Instrument an empty function.
# This estimates the overhead, that instrumentation is adding (+1 function call).
# * Instrument the sampler being used to update the statistics.
# instrument.profiler = false

#
# Advanced / Developer Options / Engine Profiler
#

# Print the engine's profiling data in regular intervals (in seconds).
# 0 = disable. Useful for developers.
# profiler_print_interval = 0
