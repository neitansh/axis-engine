# How the client talks to servers.
#
# Every setting of this file is listed below with the value the engine
# uses when the line is absent. Remove the leading # to change one.

#
# Client and Server / Client
#

# Save the map received by the client on disk.
# enable_local_map_saving = false

# When a server stops answering, keep the world on screen and wait for it to
# come back instead of returning to the main menu. Restarts and short
# outages are then barely noticeable.
# The world is reloaded once the server answers again.
# wait_for_server = true

# Give up waiting for a silent server after this many seconds and return to
# the main menu. 0 waits for as long as the player lets it.
# Requires "Wait for the server to return".
# wait_for_server_timeout = 0

# Hold incoming packets back by this many milliseconds, as a distant server
# would. For measuring how motion looks on a worse connection than the one
# you have; 0 turns the whole emulation off.
# Only affects what this client receives. Nothing is done to what it sends,
# and no server is affected.
# net_emulate_latency = 0

# Vary the emulated latency by up to this many milliseconds either way,
# which is what reorders packets on a real link.
# net_emulate_jitter = 0

# Throw away this percentage of incoming packets.
# net_emulate_loss = 0.0

# Seed for the emulated network, so that two measurements meet the same
# pattern of jitter and loss and can be compared.
# net_emulate_seed = 1234

#
# Advanced / Advanced / Networking
#

# Maximum size of the client's outgoing chat queue.
# 0 to disable queueing and -1 to make the queue size unlimited.
# max_out_chat_queue_size = 20

# Timeout for client to remove unused map data from memory, in seconds.
# client_unload_unused_data_timeout = 600.0

# Maximum number of mapblocks for client to be kept in memory.
# Note that there is an internal dynamic minimum number of blocks that
# won't be deleted, depending on the current view range.
# Set to -1 for no limit.
# client_mapblock_limit = 7500

#
# Advanced / Advanced / Miscellaneous
#

# Enable usage of remote media server (if provided by server).
# Remote servers offer a significantly faster way to download media (e.g. textures)
# when connecting to the server.
# enable_remote_media_server = true

# File in client/serverlist/ that contains your favorite servers displayed in the
# Multiplayer Tab.
# serverlist_file = favoriteservers.json
