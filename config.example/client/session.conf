# State the client remembers between runs, not settings to edit by hand.
#
# Every setting of this file is listed below with the value the engine
# uses when the line is absent. Remove the leading # to change one.

#
# Advanced / Hide: Temporary Settings
#

# Path to texture directory. All textures are first searched from here.
# texture_path =

# Enables minimap.
# enable_minimap = true

# Shape of the minimap. Enabled = round, disabled = square.
# minimap_shape_round = true

# Address to connect to.
# Leave this blank to start a local server.
# Note that the address field in the main menu overrides this setting.
# address =

# Port to connect to (UDP).
# Note that the port field in the main menu overrides this setting.
# remote_port = 30000

# Enable players getting damage and dying.
# enable_damage = false

# Enable creative mode for all players
# creative_mode = false

# Whether to allow players to damage and kill each other.
# enable_pvp = true

# Player is able to fly without being affected by gravity.
# This requires the "fly" privilege on the server.
# free_move = false

# If enabled, makes move directions relative to the player's pitch when flying or swimming.
# pitch_move = false

# Fast movement (via the "Aux1" key).
# This requires the "fast" privilege on the server.
# fast_move = false

# If enabled together with fly mode, player is able to fly through solid nodes.
# This requires the "noclip" privilege on the server.
# noclip = false

# This can be bound to a key to toggle camera smoothing when looking around.
# Useful for recording videos
# cinematic = false

# Affects mods and texture packs in the Content and Select Mods menus, as well as
# setting names.
# Controlled by a checkbox in the settings menu.
# show_technical_names = false

# Controlled by a checkbox in the settings menu.
# show_advanced = false
