# Sound output and volumes.
#
# Every setting of this file is listed below with the value the engine
# uses when the line is absent. Remove the leading # to change one.

#
# Graphics and Audio / Audio
#

# Volume of all sounds.
# Requires the sound system to be enabled.
# sound_volume = 0.8

# Volume multiplier when the window is unfocused.
# sound_volume_unfocused = 0.3

# Whether to mute sounds. You can unmute sounds at any time.
# In-game, you can toggle the mute state with the mute key or by using the
# pause menu.
# mute_sound = false

#
# Advanced / Advanced / Sound
#

# Comma-separated list of AL and ALC extensions that should not be used.
# Useful for testing. See al_extensions.[h,cpp] for details.
# sound_extensions_blacklist =
