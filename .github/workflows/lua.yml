name: lua_lint

# Lint on lua changes on builtin or if workflow changed
on:
  workflow_dispatch:
  push:
    paths:
      - 'builtin/**.lua'
      - '.luacheckrc'
      - 'util/ci/**'
      - '.github/workflows/lua.yml'
  pull_request:
    paths:
      - 'builtin/**.lua'
      - '.luacheckrc'
      - 'util/ci/**'
      - '.github/workflows/lua.yml'

jobs:
  luacheck:
    name: "Builtin Luacheck and Unit Tests"
    runs-on: ubuntu-26.04

    steps:

    - uses: actions/checkout@v7
    - uses: leafo/gh-actions-lua@v13
      with:
        luaVersion: "5.1.5"
    - uses: leafo/gh-actions-luarocks@v6

    - name: Install LuaJIT
      run: ./util/ci/build_luajit.sh

    # Инструменты ставятся в рабочий каталог прогона, а не в домашний.
    #
    # Скрипты luarocks несут в себе абсолютный путь к тому lua, с которым их
    # ставили, поэтому привязка к $HOME делает их зависимыми от того, чей
    # домашний каталог достался работе. В рабочем каталоге такой развязки нет.
    - name: Install luarocks tools
      run: |
        luarocks install --tree "$GITHUB_WORKSPACE/.luarocks" luacheck
        luarocks install --tree "$GITHUB_WORKSPACE/.luarocks" busted

    - name: Run checks (builtin)
      run: |
        "$GITHUB_WORKSPACE/.luarocks/bin/luacheck" builtin
        "$GITHUB_WORKSPACE/.luarocks/bin/busted" builtin
        "$GITHUB_WORKSPACE/.luarocks/bin/busted" builtin --lua=$HOME/LuaJIT/src/luajit

