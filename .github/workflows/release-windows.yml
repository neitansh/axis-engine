name: Manual Windows Release Build

on:
  workflow_dispatch:
    inputs:
      tag_name:
        description: "Версия релиза (например, v0.0.1)"
        required: true
        default: "v0.0.1"

# Записывать в репозиторий больше нечего: сборка уезжает в свою раздачу, а не
# в релизы GitHub.
permissions:
  contents: read

jobs:
  build_and_release:
    name: Build & Upload Windows Client
    runs-on: windows-latest

    steps:
      # ================================================================
      # Checkout
      # ================================================================
      - name: Checkout
        uses: actions/checkout@v7

      # ================================================================
      # MSYS2 CLANG64
      # ================================================================
      - name: Setup MSYS2
        uses: msys2/setup-msys2@v2
        with:
          msystem: CLANG64
          update: true
          install: >-
            git
            tar
            mingw-w64-clang-x86_64-brotli
            mingw-w64-clang-x86_64-clang
            mingw-w64-clang-x86_64-cmake
            mingw-w64-clang-x86_64-ninja
            mingw-w64-clang-x86_64-curl-winssl
            mingw-w64-clang-x86_64-libpng
            mingw-w64-clang-x86_64-libjpeg-turbo
            mingw-w64-clang-x86_64-freetype
            mingw-w64-clang-x86_64-libogg
            mingw-w64-clang-x86_64-libvorbis
            mingw-w64-clang-x86_64-sqlite3
            mingw-w64-clang-x86_64-openal
            mingw-w64-clang-x86_64-zstd
            mingw-w64-clang-x86_64-gettext
            mingw-w64-clang-x86_64-luajit
            mingw-w64-clang-x86_64-SDL2

      # ================================================================
      # Build
      # ================================================================
      - name: Configure Engine
        shell: msys2 {0}
        run: |
          # The checkout is owned by another user as far as MSYS2 git is
          # concerned, which would strip the commit hash from the version.
          git config --global --add safe.directory "$(pwd)"

          cmake -B build \
            -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DENFORCE_BUILTIN_INTEGRITY=TRUE \
            -DCMAKE_C_COMPILER=clang \
            -DCMAKE_CXX_COMPILER=clang++ \
            -DRUN_IN_PLACE=TRUE \
            -DBUILD_SERVER=FALSE \
            -DBUILD_CLIENT=TRUE \
            -DENABLE_GETTEXT=TRUE \
            -DENABLE_LEVELDB=FALSE \
            -DENABLE_REDIS=FALSE \
            -DENABLE_POSTGRESQL=FALSE \
            -DENABLE_SPATIALINDEX=FALSE \
            -DENABLE_PROMETHEUS=FALSE

      - name: Build Engine
        shell: msys2 {0}
        run: |
          cmake --build build --parallel

      # ================================================================
      # Prepare portable package
      # ================================================================
      - name: Prepare Portable Package
        shell: msys2 {0}
        run: |
          rm -rf axis_windows
          mkdir -p axis_windows/bin
          mkdir -p axis_windows/libs

          cp bin/axis.exe axis_windows/bin/

          strip axis_windows/bin/axis.exe || llvm-strip axis_windows/bin/axis.exe || true

          # Every DLL the executable needs, directly or transitively.
          echo "Bundling DLL dependencies into libs/..."
          bash util/bundle_dlls.sh \
            axis_windows/bin/axis.exe \
            axis_windows/libs

          # Runtime data
          cp -r builtin axis_windows/
          cp -r client axis_windows/
          cp -r textures axis_windows/
          cp -r fonts axis_windows/

          # Content directories the engine looks for next to the executable.
          # They ship empty on purpose: neither the game nor the mods live in
          # this repository, so the package only provides the place for them.
          mkdir -p axis_windows/games axis_windows/mods

          # Template of the configuration. The engine writes its own
          # config directory next to the executable on first run; this
          # is the documented copy players can read and copy lines from.
          cp -r config.example axis_windows/

          if [ -d locale ]; then
            cp -r locale axis_windows/
          else
            echo "::error::No compiled translations found, gettext support is missing."
            exit 1
          fi

          # Windows resolves imported DLLs next to the executable or through
          # PATH, it has no equivalent of RPATH. This launcher is what makes
          # the libs/ directory usable.
          printf '@echo off\r\nsetlocal\r\nset "PATH=%%~dp0libs;%%PATH%%"\r\n"%%~dp0bin\\axis.exe" %%*\r\n' \
            > axis_windows/axis.cmd

          echo ""
          echo "Bundled DLLs:"
          ls -1 axis_windows/libs

      # ================================================================
      # Final package validation
      # ================================================================
      - name: Validate Portable Package
        shell: pwsh
        run: |
          $root = Join-Path $PWD 'axis_windows'
          $exe = Join-Path $root 'bin\axis.exe'

          if (-not (Test-Path $exe)) {
            throw 'axis.exe was not found in the portable package.'
          }

          $dlls = @(Get-ChildItem (Join-Path $root 'libs') -Filter '*.dll' -ErrorAction SilentlyContinue)
          if ($dlls.Count -eq 0) {
            throw 'No DLLs were bundled into libs\.'
          }
          Write-Host "Bundled DLL count: $($dlls.Count)"

          $strays = @(Get-ChildItem (Join-Path $root 'bin') -Filter '*.dll' -ErrorAction SilentlyContinue)
          if ($strays.Count -ne 0) {
            throw 'DLLs must be shipped in libs\, not next to the executable.'
          }

          if (-not (Test-Path (Join-Path $root 'axis.cmd'))) {
            throw 'axis.cmd launcher is missing from the package.'
          }

          # The configuration template must survive packaging, otherwise a
          # player has no documentation of the settings at hand.
          $expected = @(
            'shared\engine.conf', 'client\graphics.conf', 'client\keybindings.conf',
            'server\server.conf', 'server\worldgen.conf'
          )
          foreach ($rel in $expected) {
            $path = Join-Path $root (Join-Path 'config.example' $rel)
            if (-not (Test-Path $path)) {
              throw "config.example\$rel is missing from the package."
            }
          }

          if (Test-Path (Join-Path $root 'minetest.conf.example')) {
            throw 'A stale minetest.conf.example found its way into the package.'
          }

          # Resolve DLLs exactly the way axis.cmd does. A missing dependency
          # makes the loader fail before main() with STATUS_DLL_NOT_FOUND.
          $env:PATH = (Join-Path $root 'libs') + ';' + $env:PATH
          $proc = Start-Process -FilePath $exe -ArgumentList '--version' -PassThru
          if (-not $proc.WaitForExit(60000)) {
            $proc.Kill()
            throw 'The packaged client did not exit within 60 seconds.'
          }
          if ($proc.ExitCode -ne 0) {
            throw "The packaged client failed to start (exit code $($proc.ExitCode))."
          }

          Write-Host 'Portable package validation passed.'

      # ================================================================
      # Create the archive
      # ================================================================
      - name: Create Portable Archive
        shell: msys2 {0}
        run: |
          # tar, сжатый brotli — тот же формат, что и под linux. Был zip;
          # brotli жмёт заметно плотнее, а игру качает каждый игрок и каждый
          # раз целиком: обновление приносит сборку, а не разницу.
          #
          # -q 11 — самое плотное, какое умеет brotli. Время сборки здесь
          # ничего не стоит: пакуем раз, качают многие.
          rm -f axis_client_windows.tar.br

          ( cd axis_windows && tar -cf - . | brotli -q 11 > ../axis_client_windows.tar.br )

          echo "Package size:"
          du -h axis_client_windows.tar.br

      - name: Verify Empty Content Directories
        shell: msys2 {0}
        run: |
          # An empty directory carries no files to pull it into the archive,
          # so its own entry is the only thing that recreates it on unpacking.
          names="$(brotli -dc axis_client_windows.tar.br | tar -tf -)"

          for d in games mods; do
            if ! printf '%s\n' "$names" | grep -q "$d/"; then
              echo "::error::$d/ did not survive into the archive."
              exit 1
            fi
          done

          echo 'Empty content directories are present in the archive.'

      # ================================================================
      # GitHub Release
      # ================================================================

      # Выкладка в раздачу. Игроки качают игру отсюда, а не с GitHub: релизы
      # GitHub из России открываются через раз, а лаунчер должен работать
      # всегда. Токен и адрес живут в настройках репозитория; нет их — шаг
      # молча пропускается, и сборка всё равно остаётся в релизах.
      - name: Upload to distribution
        shell: msys2 {0}
        env:
          AXIS_FILES_TOKEN: ${{ secrets.AXIS_FILES_TOKEN }}
          # Адрес раздачи живёт в переменных репозитория (Variables), а не в
          # секретах: он не тайна, и в логе его видно — когда что-то не
          # сходится, это важнее скрытности.
          AXIS_FILES_URL: ${{ vars.AXIS_FILES_URL }}
        run: |
          if [ -z "$AXIS_FILES_TOKEN" ] || [ -z "$AXIS_FILES_URL" ]; then
            echo "::error::Раздача не настроена: нужны секрет AXIS_FILES_TOKEN"
            echo "::error::и переменная AXIS_FILES_URL (именно переменная, не секрет)."
            echo "::error::Сборке больше некуда деться: в релизы она не публикуется."
            exit 1
          fi
          echo "Раздача: $AXIS_FILES_URL"

          # Версия без ведущей v: раздача ждёт 0.1.0, а тег обычно v0.1.0.
          version="${{ github.event.inputs.tag_name }}"
          version="${version#v}"

          curl -sSf --max-time 900 -X POST "$AXIS_FILES_URL/upload" \
            -H "Authorization: Bearer $AXIS_FILES_TOKEN" \
            -H "X-Axis-Product: game" \
            -H "X-Axis-Version: $version" \
            -H "X-Axis-Platform: windows" \
            --data-binary "@axis_client_windows.tar.br"
          echo
