name: macos

# Только ручной запуск. macOS в планах, но не раньше, чем игра будет готова
# под ПК, а до тех пор автопрогоны на каждый коммит только жгут минуты и
# держат ветку красной. Автотриггеры вернуть, когда дойдут руки до macOS.
on:
  workflow_dispatch:

# Name of what the build produces, follows project() in CMakeLists.txt.
# The executables are ${PROJECT_NAME} and ${PROJECT_NAME}server.
env:
  PROJECT_NAME: axis

jobs:
  build-older-macos:
    strategy:
      matrix:
        osver: [11.3]
        xcodever: [16.2]
        arch: ["x86_64"]
        build_type: ["Debug"]
        xcode: ["no"]
        include:
          - osver: 11.3
            xcodever: 16.2
            arch: "x86_64"
            build_type: "Debug"
            xcode: "no"
          - osver: 11.3
            xcodever: 16.2
            arch: "arm64"
            build_type: "Release"
            xcode: "yes"
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v7

      - name: Prepare environment
        run: |
          echo "REPDIR=$(pwd)" >> $GITHUB_ENV
          echo "osver=${{matrix.osver}}" >> $GITHUB_ENV
          echo "xcodever=${{matrix.xcodever}}" >> $GITHUB_ENV
          echo "arch=${{matrix.arch}}" >> $GITHUB_ENV
          echo "build_type=${{matrix.build_type}}" >> $GITHUB_ENV

      - name: Install deps
        run: |
          mkdir downloads
          source ./util/ci/common.sh
          source ./util/ci/macos_sdk.sh
          install_macos_precompiled_deps $osver $arch
          install_macos_sdk $osver "$xcodever" downloads

      - name: Build with GNU Make
        run: |
          mkdir build
          cd build
          export DEPS_DIR=/Users/Shared/macos${osver}_${arch}_deps
          export USE_XCODE=no
          ../util/ci/build_macos.sh

      - name: Build and Archive with Xcode
        if: ${{matrix.xcode == 'yes'}}
        run: |
          mkdir build_xcode
          cd build_xcode
          export DEPS_DIR=/Users/Shared/macos${osver}_${arch}_deps
          export USE_XCODE=yes
          ../util/ci/build_macos.sh

      - name: Test GNU Make build
        run: |
          ./build/macos/${{ env.PROJECT_NAME }}.app/Contents/MacOS/${{ env.PROJECT_NAME }} --run-unittests

      - name: Test XCode build
        if: ${{matrix.xcode == 'yes'}}
        run: |
          ./build_xcode/build/${build_type}/${{ env.PROJECT_NAME }}.app/Contents/MacOS/${{ env.PROJECT_NAME }} --run-unittests
          ./build_xcode/${{ env.PROJECT_NAME }}.xcarchive/Products/Applications/${{ env.PROJECT_NAME }}.app/Contents/MacOS/${{ env.PROJECT_NAME }} --run-unittests

      - name: Diff Resources
        if: ${{matrix.xcode == 'yes'}}
        run: |
          diff -rd ./build/macos/${{ env.PROJECT_NAME }}.app/Contents/Resources ./build_xcode/build/${build_type}/${{ env.PROJECT_NAME }}.app/Contents/Resources || exit 1
          diff -rd ./build/macos/${{ env.PROJECT_NAME }}.app/Contents/Resources ./build_xcode/${{ env.PROJECT_NAME }}.xcarchive/Products/Applications/${{ env.PROJECT_NAME }}.app/Contents/Resources || exit 1
      # Zipping the built .app preserves permissions on the contained files,
      #   which the GitHub artifact pipeline would otherwise strip away.
      - name: CPack
        run: |
          cd build
          rm -rf macos
          cpack -G ZIP -B macos
          set -- macos/*.zip
          mv "$1" "${1%.zip}${osver}-${arch}.zip"

      - name: Upload
        uses: actions/upload-artifact@v7
        with:
          archive: false
          path: ./build/macos/*.zip
