name: Manual Release Build

# Обе системы одной кнопкой: игру под linux и под windows выкладывают парой, а
# двумя файлами половину легко забыть — и тогда одни игроки получают новую
# игру, а другие нет.
#
# Две работы, а не матрица: общего скрипта сборки, каким живёт лаунчер, у
# движка нет — под linux зависимости ставит apt и пакет проверяет bash, под
# windows их приносит MSYS2, а проверяет pwsh.

on:
  workflow_dispatch:
    inputs:
      tag_name:
        description: "Версия релиза (например, v0.0.1)"
        required: true
        default: "v0.0.1"
      platform:
        description: "Какие системы собирать"
        type: choice
        options: [both, linux, windows]
        default: both

# Записывать в репозиторий больше нечего: сборка уезжает в свою раздачу, а не
# в релизы GitHub.
permissions:
  contents: read

# Один выпуск за раз. Два внахлёст полезли бы в раздачу вместе, а она при смене
# версии забывает прошлую — чья сборка осталась бы у игроков, решил бы порядок
# ответов. Начатое не отменяем: собранное почти до конца дешевле подождать.
concurrency:
  group: release
  cancel-in-progress: false

jobs:
  linux:
    name: Build & Upload Linux Client
    if: inputs.platform != 'windows'
    runs-on: ubuntu-22.04
    # Сборка укладывается в восемь минут; час — это про зависший шаг, который
    # иначе держал бы раннер до умолчания GitHub, то есть шесть часов.
    timeout-minutes: 60

    steps:
      - uses: actions/checkout@v7

      - name: Install Dependencies
        run: |
          source ./util/ci/common.sh
          install_linux_deps g++-11 ninja-build

      - name: Build Engine
        run: |
          # shellcheck disable=SC2016  # $ORIGIN разворачивает загрузчик, не оболочка
          cmake -B build -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DENFORCE_BUILTIN_INTEGRITY=TRUE \
            -DREQUIRE_LAUNCHER=TRUE \
            -DRUN_IN_PLACE=TRUE \
            -DBUILD_SERVER=FALSE \
            -DBUILD_CLIENT=TRUE \
            -DENABLE_GETTEXT=TRUE \
            -DCMAKE_BUILD_RPATH='$ORIGIN/../libs' \
            -DCMAKE_INSTALL_RPATH='$ORIGIN/../libs' \
            -DCMAKE_EXE_LINKER_FLAGS='-Wl,--disable-new-dtags' \
            -DENABLE_LEVELDB=FALSE \
            -DENABLE_REDIS=FALSE \
            -DENABLE_POSTGRESQL=FALSE \
            -DENABLE_SPATIALINDEX=FALSE \
            -DENABLE_PROMETHEUS=FALSE

          cmake --build build --parallel

      - name: Prepare Portable Package
        run: |
          rm -rf axis_linux
          mkdir -p axis_linux/bin
          mkdir -p axis_linux/libs

          cp bin/axis axis_linux/bin/
          strip axis_linux/bin/axis

          # Libraries that must come from the host are skipped: bundling the
          # graphics, sound or session stack makes the package fail on machines
          # whose drivers do not match the build machine.

          declare -A SEEN

          is_system_lib() {
            case "$1" in
              # Dynamic loader and kernel virtual DSO
              linux-vdso.so.*|ld-linux*.so.*)
                return 0
                ;;

              # glibc and toolchain runtime
              libc.so.*|libm.so.*|libpthread.so.*|libdl.so.*|librt.so.*|\
              libutil.so.*|libanl.so.*|libnsl.so.*|libresolv.so.*|\
              libgcc_s.so.*|libstdc++.so.*)
                return 0
                ;;

              # Graphics drivers
              libGL.so.*|libGLX.so.*|libGLdispatch.so.*|libOpenGL.so.*|\
              libGLESv2.so.*|libEGL.so.*|libglapi.so.*|libgbm.so.*|libdrm.so.*)
                return 0
                ;;

              # Display servers
              libX11.so.*|libX11-xcb.so.*|libxcb*.so.*|libXau.so.*|\
              libXdmcp.so.*|libXext.so.*|libXfixes.so.*|libXrender.so.*|\
              libXi.so.*|libXrandr.so.*|libXcursor.so.*|libXinerama.so.*|\
              libXss.so.*|libXxf86vm.so.*|libxshmfence.so.*|\
              libwayland-*.so.*|libxkbcommon*.so.*)
                return 0
                ;;

              # Sound servers. Private libraries such as libpulsecommon carry
              # no soname version, so these match on the prefix alone.
              libasound.so*|libpulse*|libjack*|libpipewire*)
                return 0
                ;;

              # Session and system services
              libdbus-1.so.*|libsystemd.so.*|libudev.so.*|libcap.so.*|\
              libselinux.so.*)
                return 0
                ;;
            esac

            return 1
          }

          copy_deps() {
            local file="$1"

            while read -r lib; do
              [ -z "$lib" ] && continue

              local name
              name="$(basename "$lib")"

              if is_system_lib "$name"; then
                continue
              fi

              if [[ "${SEEN[$name]}" == "1" ]]; then
                continue
              fi

              SEEN[$name]=1

              echo "Bundling: $name"

              cp "$lib" "axis_linux/libs/$name"

              copy_deps "$lib"
            done < <(
              ldd "$file" 2>/dev/null |
                awk '
                  /=> \// {
                    print $3
                  }
                  /^[[:space:]]*\// {
                    print $1
                  }
                '
            )
          }

          copy_deps bin/axis


          cp -r builtin axis_linux/
          cp -r client axis_linux/
          cp -r textures axis_linux/
          cp -r fonts axis_linux/

          # Content directories the engine looks for next to the executable.
          # They ship empty on purpose: neither the game nor the mods live in
          # this repository, so the package only provides the place for them.
          mkdir -p axis_linux/games axis_linux/mods

          # The engine writes its own config/ next to the executable on first
          # run; this is the documented copy players read and copy lines from.
          cp -r config.example axis_linux/

          if [ -d locale ]; then
            cp -r locale axis_linux/
          else
            echo "::error::No compiled translations found, gettext support is missing."
            exit 1
          fi


          echo ""
          echo "Bundled libraries:"
          find axis_linux/libs -maxdepth 1 -type f -printf '%f\n' | sort

          echo ""
          echo "Library sizes:"
          du -ah axis_linux/libs | sort -h

      - name: Verify Portable Package
        run: |
          if [ ! -x axis_linux/bin/axis ]; then
            echo "::error::axis was not found in the portable package."
            exit 1
          fi

          if [ -z "$(ls -A axis_linux/libs)" ]; then
            echo "::error::No libraries were bundled into libs/."
            exit 1
          fi

          # The template must survive packaging, or a player has no
          # documentation of the settings at hand.
          for f in shared/engine.conf client/graphics.conf client/keybindings.conf \
                   server/server.conf server/worldgen.conf; do
            if [ ! -f "axis_linux/config.example/$f" ]; then
              echo "::error::config.example/$f is missing from the package."
              exit 1
            fi
          done

          if [ -e axis_linux/minetest.conf ] || [ -e axis_linux/minetest.conf.example ]; then
            echo "::error::A stale minetest.conf found its way into the package."
            exit 1
          fi

          echo "RPATH:"
          readelf -d axis_linux/bin/axis | grep -E 'RPATH|RUNPATH'

          # shellcheck disable=SC2016  # $ORIGIN разворачивает загрузчик, не оболочка
          if ! readelf -d axis_linux/bin/axis | grep -qE '\$ORIGIN/\.\./libs'; then
            echo "::error::The executable does not point at ../libs."
            exit 1
          fi

          # DT_RUNPATH is not inherited by the dependencies of a library, so
          # transitively needed libraries would silently come from the host.
          if readelf -d axis_linux/bin/axis | grep -q '(RUNPATH)'; then
            echo "::error::The executable uses RUNPATH, link it with --disable-new-dtags."
            exit 1
          fi

          resolved="$(ldd axis_linux/bin/axis)"

          echo ""
          echo "Resolved dependencies:"
          echo "$resolved"

          if echo "$resolved" | grep -q "not found"; then
            echo "::error::Missing shared library dependency."
            exit 1
          fi

          # A bundled library that still resolves elsewhere is dead weight: some
          # other library requests it through an RPATH of its own, which wins.
          # That is not a packaging failure, RPATH correctness is checked above.
          libs_dir="$(cd axis_linux/libs && pwd)"

          for lib in axis_linux/libs/*; do
            name="$(basename "$lib")"
            path="$(echo "$resolved" | awk -v n="$name" '$1 == n { print $3 }')"
            [ -z "$path" ] && continue

            dir="$(cd "$(dirname "$path")" && pwd)"
            if [ "$dir" != "$libs_dir" ]; then
              echo "::warning::$name is provided by the host ($path), dropping it."
              rm -f "$lib"
            fi
          done

          # A gate, not advice: glibc is compatible backwards but not
          # forwards, so a client built against a newer one dies on the
          # player's machine with GLIBC_x.y not found. It stays inside the
          # floor only because the runner image is ubuntu-22.04 — when GitHub
          # retires it, the build has to stop here instead of quietly shipping.
          # Steps run with pipefail, so a file objdump cannot read and a grep
          # that matches nothing would both take the whole step down with no
          # word about what happened. The empty answer is checked below instead.
          floor=2.35
          symbols="$(objdump -T axis_linux/bin/axis axis_linux/libs/* 2>/dev/null || true)"
          needs="$(printf '%s\n' "$symbols" |
            grep -oE 'GLIBC_[0-9]+\.[0-9]+' | sed 's/GLIBC_//' | sort -uV | tail -1 || true)"
          if [ -z "$needs" ]; then
            echo "::error::Could not tell which glibc the package needs."
            exit 1
          fi
          if [ "$(printf '%s\n%s\n' "$needs" "$floor" | sort -V | head -1)" != "$needs" ]; then
            echo "::error::The package needs glibc $needs, and we ship no newer than $floor."
            exit 1
          fi
          echo "glibc: needs $needs, floor $floor"

          echo ""
          echo "Starting the packaged client:"
          ./axis_linux/bin/axis --version

          # The build carries REQUIRE_LAUNCHER, and a build that forgot it
          # would open the main menu instead of refusing. Checked the same way
          # under windows. The message matters as much as the exit code: with
          # no display around, the client would fail here anyway, and a bare
          # failure would pass for a refusal it never made.
          if out="$(timeout 60 ./axis_linux/bin/axis 2>&1)"; then
            echo "::error::The packaged client started without the launcher."
            exit 1
          fi
          if ! printf '%s' "$out" | grep -q "not on its own"; then
            echo "::error::The client refused for some other reason:"
            printf '%s\n' "$out"
            exit 1
          fi


      # Игроки качают игру из раздачи, а не с GitHub: релизы GitHub из России
      # открываются через раз. Раздача не настроена — сборка падает здесь же:
      # деться готовому больше некуда, а тихо пропущенная выкладка выглядит как
      # удачный выпуск, которого не было.
      #
      # X-Axis-Kind обязателен: умолчание «архив» однажды превратило бы забытый
      # заголовок в сборку, на которую обновятся все. Игра бывает только
      # архивом, но сказать об этом раздача просит явно.
      - name: Upload to distribution
        env:
          AXIS_FILES_TOKEN: ${{ secrets.AXIS_FILES_TOKEN }}
          # Адрес — в переменных репозитория, а не в секретах: он не тайна, и
          # видеть его в логе важнее, чем прятать.
          AXIS_FILES_URL: ${{ vars.AXIS_FILES_URL }}
        run: |
          if [ -z "$AXIS_FILES_TOKEN" ] || [ -z "$AXIS_FILES_URL" ]; then
            echo "::error::Раздача не настроена: нужны секрет AXIS_FILES_TOKEN"
            echo "::error::и переменная AXIS_FILES_URL (именно переменная, не секрет)."
            echo "::error::Сборке больше некуда деться: в релизы она не публикуется."
            exit 1
          fi
          echo "Раздача: $AXIS_FILES_URL"

          # Версия без ведущей v: раздача ждёт 0.1.0, а тег обычно v0.1.0.
          version="${{ github.event.inputs.tag_name }}"
          version="${version#v}"

          # Был zip; brotli жмёт заметно плотнее, а игру качает каждый игрок и
          # каждый раз целиком — обновление приносит сборку, а не разницу. Tar
          # вдобавок несёт права на файл, поэтому клиент приезжает исполняемым.
          # -q 11 — самое плотное: пакуем раз, качают многие.
          ( cd axis_linux && tar -cf - . | brotli -q 11 > "../axis-$version-linux.tar.br" )

          # games/ и mods/ приезжают пустыми, а держится пустой каталог в
          # архиве одной своей записью — потерять её легко и незаметно.
          for d in games mods; do
            if ! tar -tf "axis-$version-linux.tar.br" --use-compress-program=brotli | grep -q "$d/"; then
              echo "::error::$d/ не пережил упаковку."
              exit 1
            fi
          done

          curl -sSf --max-time 900 -X POST "$AXIS_FILES_URL/upload" \
            -H "Authorization: Bearer $AXIS_FILES_TOKEN" \
            -H "X-Axis-Product: game" \
            -H "X-Axis-Kind: archive" \
            -H "X-Axis-Version: $version" \
            -H "X-Axis-Platform: linux" \
            --data-binary "@axis-$version-linux.tar.br"
          echo


  windows:
    name: Build & Upload Windows Client
    if: inputs.platform != 'linux'
    runs-on: windows-latest
    timeout-minutes: 60

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup MSYS2
        uses: msys2/setup-msys2@v2
        with:
          msystem: CLANG64
          update: true
          install: >-
            git
            tar
            mingw-w64-clang-x86_64-brotli
            mingw-w64-clang-x86_64-clang
            mingw-w64-clang-x86_64-cmake
            mingw-w64-clang-x86_64-ninja
            mingw-w64-clang-x86_64-curl-winssl
            mingw-w64-clang-x86_64-libpng
            mingw-w64-clang-x86_64-libjpeg-turbo
            mingw-w64-clang-x86_64-freetype
            mingw-w64-clang-x86_64-libogg
            mingw-w64-clang-x86_64-libvorbis
            mingw-w64-clang-x86_64-sqlite3
            mingw-w64-clang-x86_64-openal
            mingw-w64-clang-x86_64-zstd
            mingw-w64-clang-x86_64-gettext
            mingw-w64-clang-x86_64-luajit
            mingw-w64-clang-x86_64-SDL2

      - name: Configure Engine
        shell: msys2 {0}
        run: |
          # The checkout is owned by another user as far as MSYS2 git is
          # concerned, which would strip the commit hash from the version.
          git config --global --add safe.directory "$(pwd)"

          cmake -B build \
            -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DENFORCE_BUILTIN_INTEGRITY=TRUE \
            -DREQUIRE_LAUNCHER=TRUE \
            -DCMAKE_C_COMPILER=clang \
            -DCMAKE_CXX_COMPILER=clang++ \
            -DRUN_IN_PLACE=TRUE \
            -DBUILD_SERVER=FALSE \
            -DBUILD_CLIENT=TRUE \
            -DENABLE_GETTEXT=TRUE \
            -DENABLE_LEVELDB=FALSE \
            -DENABLE_REDIS=FALSE \
            -DENABLE_POSTGRESQL=FALSE \
            -DENABLE_SPATIALINDEX=FALSE \
            -DENABLE_PROMETHEUS=FALSE

      - name: Build Engine
        shell: msys2 {0}
        run: |
          cmake --build build --parallel

      - name: Prepare Portable Package
        shell: msys2 {0}
        run: |
          rm -rf axis_windows
          mkdir -p axis_windows/bin
          mkdir -p axis_windows/libs

          cp bin/axis.exe axis_windows/bin/

          strip axis_windows/bin/axis.exe || llvm-strip axis_windows/bin/axis.exe || true

          echo "Bundling DLL dependencies into libs/..."
          bash util/bundle_dlls.sh \
            axis_windows/bin/axis.exe \
            axis_windows/libs

          cp -r builtin axis_windows/
          cp -r client axis_windows/
          cp -r textures axis_windows/
          cp -r fonts axis_windows/

          # Content directories the engine looks for next to the executable.
          # They ship empty on purpose: neither the game nor the mods live in
          # this repository, so the package only provides the place for them.
          mkdir -p axis_windows/games axis_windows/mods

          cp -r config.example axis_windows/

          if [ -d locale ]; then
            cp -r locale axis_windows/
          else
            echo "::error::No compiled translations found, gettext support is missing."
            exit 1
          fi

          # Windows resolves imported DLLs next to the executable or through
          # PATH, it has no equivalent of RPATH. A .cmd wrapper used to add
          # libs/ to PATH here; it is gone on purpose. The launcher starts the
          # client itself and prepends libs/ to the child's PATH, and a wrapper
          # sitting in the package is a second way in — one that starts the
          # game with no launcher behind it.

          echo ""
          echo "Bundled DLLs:"
          ls -1 axis_windows/libs

      - name: Validate Portable Package
        shell: pwsh
        run: |
          $root = Join-Path $PWD 'axis_windows'
          $exe = Join-Path $root 'bin\axis.exe'

          if (-not (Test-Path $exe)) {
            throw 'axis.exe was not found in the portable package.'
          }

          $dlls = @(Get-ChildItem (Join-Path $root 'libs') -Filter '*.dll' -ErrorAction SilentlyContinue)
          if ($dlls.Count -eq 0) {
            throw 'No DLLs were bundled into libs\.'
          }
          Write-Host "Bundled DLL count: $($dlls.Count)"

          $strays = @(Get-ChildItem (Join-Path $root 'bin') -Filter '*.dll' -ErrorAction SilentlyContinue)
          if ($strays.Count -ne 0) {
            throw 'DLLs must be shipped in libs\, not next to the executable.'
          }

          $wrappers = @(Get-ChildItem $root -Filter '*.cmd' -ErrorAction SilentlyContinue)
          if ($wrappers.Count -ne 0) {
            throw 'The package must ship no .cmd wrapper: the launcher starts the client.'
          }

          $expected = @(
            'shared\engine.conf', 'client\graphics.conf', 'client\keybindings.conf',
            'server\server.conf', 'server\worldgen.conf'
          )
          foreach ($rel in $expected) {
            $path = Join-Path $root (Join-Path 'config.example' $rel)
            if (-not (Test-Path $path)) {
              throw "config.example\$rel is missing from the package."
            }
          }

          if (Test-Path (Join-Path $root 'minetest.conf.example')) {
            throw 'A stale minetest.conf.example found its way into the package.'
          }

          # Resolve DLLs exactly the way the launcher does. A missing dependency
          # makes the loader fail before main() with STATUS_DLL_NOT_FOUND.
          $env:PATH = (Join-Path $root 'libs') + ';' + $env:PATH
          $proc = Start-Process -FilePath $exe -ArgumentList '--version' -PassThru
          if (-not $proc.WaitForExit(60000)) {
            $proc.Kill()
            throw 'The packaged client did not exit within 60 seconds.'
          }
          if ($proc.ExitCode -ne 0) {
            throw "The packaged client failed to start (exit code $($proc.ExitCode))."
          }

          # The package is built with REQUIRE_LAUNCHER, and a build that forgot
          # it would open the main menu here instead of refusing. Started with
          # no ticket door, the client must stop before it opens a window.
          $alone = Start-Process -FilePath $exe -PassThru
          if (-not $alone.WaitForExit(60000)) {
            $alone.Kill()
            throw 'The packaged client kept running without the launcher.'
          }
          if ($alone.ExitCode -eq 0) {
            throw 'The packaged client started without the launcher.'
          }

          Write-Host 'Portable package validation passed.'

      - name: Create Portable Archive
        shell: msys2 {0}
        run: |
          # Тот же tar с brotli, что и под linux, и по тем же доводам.
          rm -f axis_client_windows.tar.br

          ( cd axis_windows && tar -cf - . | brotli -q 11 > ../axis_client_windows.tar.br )

          echo "Package size:"
          du -h axis_client_windows.tar.br

      - name: Verify Empty Content Directories
        shell: msys2 {0}
        run: |
          # The same check as under linux: an empty directory is held in the
          # archive by its own entry alone.
          names="$(brotli -dc axis_client_windows.tar.br | tar -tf -)"

          for d in games mods; do
            if ! printf '%s\n' "$names" | grep -q "$d/"; then
              echo "::error::$d/ did not survive into the archive."
              exit 1
            fi
          done

          echo 'Empty content directories are present in the archive.'

      # Та же выкладка, что и под linux, и те же доводы.
      - name: Upload to distribution
        shell: msys2 {0}
        env:
          AXIS_FILES_TOKEN: ${{ secrets.AXIS_FILES_TOKEN }}
          AXIS_FILES_URL: ${{ vars.AXIS_FILES_URL }}
        run: |
          if [ -z "$AXIS_FILES_TOKEN" ] || [ -z "$AXIS_FILES_URL" ]; then
            echo "::error::Раздача не настроена: нужны секрет AXIS_FILES_TOKEN"
            echo "::error::и переменная AXIS_FILES_URL (именно переменная, не секрет)."
            echo "::error::Сборке больше некуда деться: в релизы она не публикуется."
            exit 1
          fi
          echo "Раздача: $AXIS_FILES_URL"

          version="${{ github.event.inputs.tag_name }}"
          version="${version#v}"

          curl -sSf --max-time 900 -X POST "$AXIS_FILES_URL/upload" \
            -H "Authorization: Bearer $AXIS_FILES_TOKEN" \
            -H "X-Axis-Product: game" \
            -H "X-Axis-Kind: archive" \
            -H "X-Axis-Version: $version" \
            -H "X-Axis-Platform: windows" \
            --data-binary "@axis_client_windows.tar.br"
          echo
