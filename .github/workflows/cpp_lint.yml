name: cpp_lint

# lint on c/cpp changes or workflow changes
on:
  workflow_dispatch:
  push:
    paths:
      - 'lib/**.[ch]'
      - 'lib/**.cpp'
      - 'src/**.[ch]'
      - 'src/**.cpp'
      - 'irr/**.[ch]'
      - 'irr/**.cpp'
      - '**/CMakeLists.txt'
      - 'cmake/Modules/**'
      - 'util/ci/**'
      - '.github/workflows/**.yml'
  pull_request:
    paths:
      - 'lib/**.[ch]'
      - 'lib/**.cpp'
      - 'src/**.[ch]'
      - 'src/**.cpp'
      - 'irr/**.[ch]'
      - 'irr/**.cpp'
      - '**/CMakeLists.txt'
      - 'cmake/Modules/**'
      - 'util/ci/**'
      - '.github/workflows/**.yml'

# clang-tidy-20 есть только на образе 26.04: у GitHub на 24.04 верхняя версия 18,
# а upstream'ного 15 нет уже нигде. Отсюда и ubuntu-26.04 в runs-on.
env:
  CLANG_TIDY: clang-tidy-20

jobs:
  clang_tidy:
    runs-on: ubuntu-26.04
    steps:
    - uses: actions/checkout@v7
    - name: Install deps
      run: |
        source ./util/ci/common.sh
        install_linux_deps $CLANG_TIDY

    - name: Run clang-tidy
      run: |
        ./util/ci/clang-tidy.sh

  settings_domains:
    name: "Settings domain table"
    runs-on: ubuntu-26.04
    steps:
    - uses: actions/checkout@v7
    # Every setting belongs to exactly one configuration file. The table the
    # engine uses is generated from builtin/settingtypes.txt, so a new setting
    # without a regenerated table would end up in custom.conf unnoticed.
    - name: Check the table matches settingtypes.txt
      run: |
        python3 util/generate_settings_domains.py --check
