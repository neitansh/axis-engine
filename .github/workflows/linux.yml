name: linux

# build on c/cpp changes or workflow changes
on:
  workflow_dispatch:
  push:
    paths:
      - 'lib/**.[ch]'
      - 'lib/**.cpp'
      - 'src/**.[ch]'
      - 'src/**.cpp'
      - 'irr/**.[ch]'
      - 'irr/**.cpp'
      - '**/CMakeLists.txt'
      - 'cmake/Modules/**'
      - 'po/**.po'
      - 'client/shaders/**'
      - 'util/ci/**'
      - 'util/helper_mod/**'
      - '.github/workflows/linux.yml'
  pull_request:
    paths:
      - 'lib/**.[ch]'
      - 'lib/**.cpp'
      - 'src/**.[ch]'
      - 'src/**.cpp'
      - 'irr/**.[ch]'
      - 'irr/**.cpp'
      - '**/CMakeLists.txt'
      - 'cmake/Modules/**'
      - 'po/**.po'
      - 'client/shaders/**'
      - 'util/ci/**'
      - 'util/helper_mod/**'
      - '.github/workflows/linux.yml'

# Name of what the build produces, follows project() in CMakeLists.txt.
# The executables are ${PROJECT_NAME} and ${PROJECT_NAME}server.
env:
  PROJECT_NAME: axis
  MINETEST_POSTGRESQL_CONNECT_STRING: 'host=localhost user=minetest password=minetest dbname=minetest'

jobs:
  # Одна сборка вместо матрицы из пяти. Матрица в upstream существует ради
  # десятков дистрибутивов со старыми компиляторами; здесь движок собирают
  # и раздают сами, поэтому проверять нужно ровно одно: собирается ли он
  # текущим компилятором и проходят ли юнит-тесты.
  build:
    name: "gcc 14 + unit tests"
    runs-on: [self-hosted, linux, x64, public]
    steps:
      - uses: actions/checkout@v7
      - name: Install deps
        run: |
          source ./util/ci/common.sh
          install_linux_deps g++-14 libluajit-5.1-dev

      - name: Build
        run: |
          ./util/ci/build.sh
        env:
          CC: gcc-14
          CXX: g++-14
          # just to check that they compile correctly
          CMAKE_FLAGS: '-DBUILD_BENCHMARKS=1'

      - name: Test
        run: |
          mkdir nowrite
          chmod a-w nowrite
          cd nowrite
          ../bin/${{ env.PROJECT_NAME }} --run-unittests
