name: Feature request
description: Suggest an idea for this project
labels: ["Feature request"]
body:
  - type: markdown
    attributes:
      value: |
        Please note the following:
        1. Only submit a feature request if the feature does not already exist on the latest `main`.
        2. This page is for suggesting changes to **the Axis engine itself**, not to the games running on it.
        3. If you have used an LLM/AI to format your issue description, disclose this. Try to keep it concise. No walls of text please.
  - type: textarea
    attributes:
      label: Problem
      description: |
        A clear and concise description of the problem, i.e. "Why is this needed?"
        Example: I'm always frustrated when [...]
    validations:
      required: true
  - type: textarea
    attributes:
      label: Solutions
      description: |
        A clear and concise description of what you want to happen.
    validations:
      required: true
  - type: textarea
    attributes:
      label: Alternatives
      description: |
        A clear and concise description of any alternative solutions or features you've considered.
    validations:
      required: true
  - type: textarea
    attributes:
      label: Additional context
      description: |
        Add any other context or screenshots about the feature request here.
    validations:
      required: false
