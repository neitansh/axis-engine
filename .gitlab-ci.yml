---
# Осталось от upstream: у Luanti есть ежедневное зеркало на GitLab, у Axis его
# нет. Этот файл здесь ничего не собирает — единственная задача deploy'ит
# страницу перенаправлений (misc/make_redirects.sh) в проект, которого у нас не
# существует.


pages:
  stage: deploy
  image: python:3.8
  script:
    - ./misc/make_redirects.sh
  artifacts:
    paths:
      - public
  only:
    - master
